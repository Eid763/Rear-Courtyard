<style>

:root[data-theme="dark"]{--bg:#121a1f;--panel:rgba(14,18,20,.84);--ink:#f3f1ea;--muted:#aab0a9}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;overflow:hidden;background:var(--bg);font-family:Barlow,"Helvetica Neue",Arial,sans-serif;color:var(--ink)}
#stage{position:relative;width:100%;height:100%;touch-action:none}
canvas{display:block;width:100%;height:100%;cursor:grab}
canvas:active{cursor:grabbing}
.cap{position:absolute;top:14px;left:14px;max-width:min(400px,calc(100% - 28px));background:var(--panel);border-radius:10px;padding:12px 16px 14px;backdrop-filter:blur(2px)}
.step{font-size:13px;color:var(--muted);margin:0 0 2px;letter-spacing:.02em}
.cap h1{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:600;font-size:26px;line-height:1.1;margin:0 0 6px}
.cap p{font-size:15px;line-height:1.45;margin:0;color:var(--ink)}
.bar{position:absolute;left:14px;right:14px;bottom:14px;display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:10px;padding:8px 12px}
button{font:inherit;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.play{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#1b1b1b;display:grid;place-items:center;flex:none}
.play svg{width:16px;height:16px}
.ghost{background:transparent;color:var(--ink);font-size:14px;padding:6px 8px;border-radius:6px;flex:none}
input[type=range]{flex:1;accent-color:var(--accent);min-width:60px}
.time{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted);flex:none;min-width:78px;text-align:right}
.hint{position:absolute;right:14px;top:14px;background:var(--panel);border-radius:8px;padding:6px 10px;font-size:13px;color:var(--muted);opacity:0;transition:opacity .3s}
.hint.on{opacity:1}
@media (max-width:560px){.cap h1{font-size:22px}.cap p{font-size:14px}.hint{top:auto;bottom:74px}.time{min-width:0}}
</style>
</head>

const cv=renderer.domElement,ptrs=new Map();let pinch=0;
function initFree(){if(free)return;const off=camera.position.clone().sub(look);const r=off.length();free={tg:look.clone(),r,th:Math.atan2(off.x,off.z),ph:Math.acos(clamp(off.y/r,-1,1))};}
function applyFree(){const f=free;camera.position.set(f.tg.x+f.r*Math.sin(f.ph)*Math.sin(f.th),f.tg.y+f.r*Math.cos(f.ph),f.tg.z+f.r*Math.sin(f.ph)*Math.cos(f.th));camera.lookAt(f.tg);}
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);initFree();playing=false;ui();if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch=Math.hypot(a[0]-b[0],a[1]-b[1]);}});
cv.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId)||!free)return;const p=ptrs.get(e.pointerId);const dx=e.clientX-p[0],dy=e.clientY-p[1];ptrs.set(e.pointerId,[e.clientX,e.clientY]);if(ptrs.size===1){free.th-=dx*.005;free.ph=clamp(free.ph-dy*.005,.2,1.5);}else if(ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pinch)free.r=clamp(free.r*pinch/d,1.2,30);pinch=d;}applyFree();});

cv.addEventListener('wheel',e=>{e.preventDefault();initFree();playing=false;ui();free.r=clamp(free.r*(1+e.deltaY*.001),1.2,30);applyFree();},{passive:false});
